name: Update DZNE RSS Feed

on:
  schedule:
    # Läuft alle 4 Stunden automatisch (Cron-Syntax)
    - cron: '0 */4 * * *'
  # Erlaubt auch einen manuellen Start über den GitHub-Tab "Actions"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Wichtig: Erlaubt dem Skript, Änderungen (die neue XML-Datei) zurück ins Repository zu schreiben
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script to generate RSS
        run: python generate_rss.py

      - name: Commit and push if it changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dzne_news_feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update RSS feed" && git push)
